name: Publish

# Tag a commit vX.Y.Z to release every package at that version.
# Publishes via NuGet Trusted Publishing (OIDC) - no API key secret needed.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Releases leave out every sample project and the Graphite test projects, which need a GPU.
      - name: Trim solution
        run: |
          cp Anthology.slnx Publish.slnx
          excluded=$(dotnet sln Publish.slnx list | tr '\\' '/' | grep -Ei '^Graphite/Tests/|(^|/)Samples?/|Sample[^/]*\.csproj$')
          echo "Leaving out:"
          echo "$excluded"
          dotnet sln Publish.slnx remove $excluded

      - name: Restore
        run: dotnet restore Publish.slnx

      - name: Build
        run: dotnet build Publish.slnx -c Release --no-restore

      # Some suites need things CI lacks (they pass locally), so they're excluded: Clay (uncommitted model
      # assets) and Slang (native binaries fetched after this step). Matching is substring on
      # FullyQualifiedName (the test namespace, not the .csproj name): Slang's namespace is
      # "Prowl.Slang.Test" (singular) even though its project is Prowl.Slang.Tests. Everything else gates the release.
      - name: Test
        run: dotnet test Publish.slnx -c Release --no-build --filter "FullyQualifiedName!~Prowl.Clay.Tests&FullyQualifiedName!~Prowl.Slang.Test"

      # Slang's native binaries are not committed; fetch them so they pack into runtimes/.
      - name: Fetch Slang native binaries
        working-directory: Slang/Native
        run: dotnet run UpdateSources.cs

      - name: Pack
        run: dotnet pack Publish.slnx -c Release --no-build -o artifacts/nuget

      - name: NuGet auth (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Wulferis

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
