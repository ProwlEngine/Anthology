name: Warp

on:
  pull_request:
    paths:
      - 'Warp/**'
      - 'Directory.Build.*'
      - '.github/workflows/warp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test all supported frameworks
        run: dotnet test Warp/Tests/Prowl.Warp.Tests.csproj -c Release
      - name: Reconnect and transfer stress
        if: runner.os == 'Linux'
        env:
          WARP_STRESS_ROUNDS: '100'
        run: dotnet test Warp/Tests/Prowl.Warp.Tests.csproj -c Release --no-build --framework net10.0 --filter FullyQualifiedName~RobustnessTests
      - name: Check package
        run: dotnet pack Warp/Warp/Prowl.Warp.csproj -c Release --no-build -o artifacts/warp
